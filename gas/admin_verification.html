  <script>
    function adminVerificationApp() {
      return {
        loading: true,
        errorMsg: '',
        submitting: false,
        lastAction: '',
        result: null,
        allGroups: [],
        selected: {},
        filterStudent: '',
        filterDivision: '',

        // Computed
        get studentOptions() {
          return this.allGroups.map(g => ({
            student_id: g.student_id,
            name: g.name,
            academic_id: g.academic_id,
          })).sort((a, b) => a.name.localeCompare(b.name));
        },

        get divisionOptions() {
          var codes = {};
          this.allGroups.forEach(g => {
            g.records.forEach(r => { if (r.division_code) codes[r.division_code] = true; });
          });
          return Object.keys(codes).sort();
        },

        get filteredGroups() {
          var self = this;
          return this.allGroups
            .filter(g => {
              if (self.filterStudent && g.student_id !== self.filterStudent) return false;
              if (self.filterDivision) {
                return g.records.some(r => r.division_code === self.filterDivision);
              }
              return true;
            })
            .map(g => {
              if (!self.filterDivision) return g;
              return { ...g, _filtered: true };
            });
        },

        get totalFilteredPending() {
          var self = this;
          return this.filteredGroups.reduce((sum, g) => sum + self.filteredRecords(g).length, 0);
        },

        get isAllSelected() {
          var self = this;
          var all = [];
          this.filteredGroups.forEach(g => {
            self.filteredRecords(g).forEach(r => all.push(r.record_id));
          });
          return all.length > 0 && all.every(id => !!self.selected[id]);
        },

        filteredRecords(group) {
          if (!this.filterDivision) return group.records;
          return group.records.filter(r => r.division_code === this.filterDivision);
        },

        totalSelected() {
          return Object.keys(this.selected).length;
        },

        isSelected(id) { return !!this.selected[id]; },

        isAllStudentSelected(studentId) {
          var group = this.filteredGroups.find(g => g.student_id === studentId);
          if (!group) return false;
          var recs = this.filteredRecords(group);
          return recs.length > 0 && recs.every(r => !!this.selected[r.record_id]);
        },

        someStudentSelected(studentId) {
          var group = this.filteredGroups.find(g => g.student_id === studentId);
          if (!group) return false;
          return this.filteredRecords(group).some(r => !!this.selected[r.record_id]);
        },

        toggleRecord(id) {
          if (this.selected[id]) { delete this.selected[id]; }
          else { this.selected[id] = true; }
          this.selected = Object.assign({}, this.selected);
        },

        toggleStudent(studentId) {
          var group = this.filteredGroups.find(g => g.student_id === studentId);
          if (!group) return;
          var recs = this.filteredRecords(group);
          var allSel = recs.every(r => !!this.selected[r.record_id]);
          recs.forEach(r => {
            if (allSel) { delete this.selected[r.record_id]; }
            else { this.selected[r.record_id] = true; }
          });
          this.selected = Object.assign({}, this.selected);
        },

        toggleAll() {
          var self = this;
          var all = [];
          this.filteredGroups.forEach(g => {
            self.filteredRecords(g).forEach(r => all.push(r.record_id));
          });
          var allSel = all.every(id => !!self.selected[id]);
          all.forEach(id => {
            if (allSel) { delete self.selected[id]; }
            else { self.selected[id] = true; }
          });
          this.selected = Object.assign({}, this.selected);
        },

        divisionColor(code) {
          var map = {
            OPER: 'bg-blue-50 text-blue-700 border border-blue-200',
            ENDO: 'bg-purple-50 text-purple-700 border border-purple-200',
            PERIO: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
            PROSTH: 'bg-amber-50 text-amber-700 border border-amber-200',
            DIAG: 'bg-cyan-50 text-cyan-700 border border-cyan-200',
            RADIO: 'bg-gray-100 text-gray-700 border border-gray-200',
            SUR: 'bg-red-50 text-red-700 border border-red-200',
            ORTHO: 'bg-indigo-50 text-indigo-700 border border-indigo-200',
            PEDO: 'bg-pink-50 text-pink-700 border border-pink-200',
          };
          return map[code] || 'bg-gray-50 text-gray-600 border border-gray-200';
        },

        formatDate(iso) {
          if (!iso) return '-';
          var d = new Date(iso);
          return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        },

        bulkAction(action) {
          var selectedIds = Object.keys(this.selected);
          if (selectedIds.length === 0 || this.submitting) return;

          var allRecords = [];
          this.allGroups.forEach(g => {
            g.records.forEach(r => {
              if (this.selected[r.record_id]) allRecords.push(r);
            });
          });

          this.submitting = true;
          this.lastAction = action;
          this.result = null;

          google.script.run
            .withSuccessHandler(res => {
              this.submitting = false;
              this.result = res;
              if (res.success) {
                this.allGroups = this.allGroups
                  .map(g => ({
                    ...g,
                    records: g.records.filter(r => !this.selected[r.record_id])
                  }))
                  .filter(g => g.records.length > 0);
                this.selected = {};
              }
            })
            .withFailureHandler(err => {
              this.submitting = false;
              this.result = { success: false, error: err.message || 'Unknown error' };
            })
            .adminBulkUpdateRecordStatus({ records: allRecords, action: action });
        },

        init() {
          this.loading = true;
          this.errorMsg = '';
          google.script.run
            .withSuccessHandler(data => {
              this.allGroups = data || [];
              this.loading = false;
            })
            .withFailureHandler(err => {
              this.errorMsg = err.message || 'Failed to load pending verifications.';
              this.loading = false;
            })
            .adminGetAllPendingVerifications();
        },
      };
    }
  </script>
