<!--
  Beta Feedback Widget — floating button + modal.
  Drop into any page with <?!= include('feedback_widget') ?> just before </body>.
  Self-contained Alpine component (`feedbackWidget()`), so it can coexist with
  any page-level x-data scope. Hides itself when the admin toggle is off.
-->
<div x-data="feedbackWidget()" x-init="init()" x-cloak>
  <!-- Floating launcher button -->
  <button
    type="button"
    x-show="enabled"
    @click="open = true"
    x-transition
    class="fixed bottom-5 right-5 z-[100] bg-violet-600 hover:bg-violet-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all flex items-center gap-2 px-4 py-3 text-sm font-medium group"
    title="ส่ง Feedback เกี่ยวกับการใช้งาน">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <span class="hidden sm:inline">Feedback</span>
  </button>

  <!-- Modal -->
  <div
    x-show="open"
    x-transition.opacity
    @keydown.escape.window="close()"
    class="fixed inset-0 z-[110] bg-black/50 flex items-end sm:items-center justify-center p-3 sm:p-4">
    <div
      @click.outside="close()"
      x-transition
      class="bg-white rounded-2xl shadow-2xl w-full sm:max-w-md max-h-[90vh] overflow-y-auto">
      <!-- Header -->
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-gray-900">ส่ง Feedback</h3>
          <p class="text-xs text-gray-500 mt-0.5">เราอ่านทุกข้อความเพื่อปรับปรุงการใช้งาน</p>
        </div>
        <button @click="close()" class="text-gray-400 hover:text-gray-600 p-1 -mr-1" title="ปิด">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-5 py-4 space-y-4">
        <!-- Rating -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-2">
            ให้คะแนนประสบการณ์การใช้งาน <span class="text-red-500">*</span>
          </label>
          <div class="flex items-center gap-1.5">
            <template x-for="n in 5" :key="n">
              <button
                type="button"
                @click="rating = n"
                @mouseenter="hover = n"
                @mouseleave="hover = 0"
                :title="ratingLabel(n)"
                class="p-1 transition-transform hover:scale-110">
                <svg class="w-8 h-8" :class="(hover || rating) >= n ? 'text-amber-400' : 'text-gray-300'" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118L2.05 10.1c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.518-4.674z"/>
                </svg>
              </button>
            </template>
            <span class="text-xs text-gray-500 ml-2" x-text="ratingLabel(hover || rating)"></span>
          </div>
        </div>

        <!-- Comment -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">
            ความคิดเห็น <span class="text-gray-400 font-normal">(ถ้ามี)</span>
          </label>
          <textarea
            x-model="comment"
            rows="4"
            maxlength="4000"
            placeholder="พบปัญหาตรงไหน อยากให้ปรับอะไร หรือชอบส่วนไหนเป็นพิเศษ?"
            class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 resize-none"></textarea>
          <p class="text-[0.65rem] text-gray-400 mt-1" x-text="comment.length + ' / 4000'"></p>
        </div>

        <!-- Auto-captured context (transparent to user) -->
        <div class="bg-gray-50 rounded-lg px-3 py-2 text-[0.7rem] text-gray-500 space-y-0.5">
          <p>ระบบจะแนบข้อมูลต่อไปนี้ไปด้วยอัตโนมัติ:</p>
          <p class="text-gray-600">• หน้า: <span class="font-mono" x-text="pageLabel"></span></p>
        </div>

        <!-- Error -->
        <div x-show="error" x-transition class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2" x-text="error"></div>
      </div>

      <!-- Footer -->
      <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-end gap-2">
        <button
          @click="close()"
          type="button"
          :disabled="submitting"
          class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg disabled:opacity-50">
          ยกเลิก
        </button>
        <button
          @click="submit()"
          type="button"
          :disabled="submitting || rating < 1"
          class="px-4 py-2 text-sm font-medium text-white bg-violet-600 hover:bg-violet-700 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <svg x-show="submitting" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
          <span x-text="submitting ? 'กำลังส่ง…' : 'ส่ง Feedback'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Thank-you toast -->
  <div
    x-show="thanks"
    x-transition
    class="fixed bottom-5 right-5 z-[120] bg-emerald-600 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    ขอบคุณสำหรับ Feedback!
  </div>
</div>

<script>
  function feedbackWidget() {
    return {
      enabled: false,
      open: false,
      rating: 0,
      hover: 0,
      comment: "",
      submitting: false,
      error: "",
      thanks: false,
      pageLabel: "",

      init() {
        // Derive a friendly page name from ?page=X or fall back to "landing"
        try {
          var qs = new URLSearchParams(window.location.search);
          this.pageLabel = qs.get("page") || "landing";
        } catch (e) {
          this.pageLabel = "unknown";
        }
        // Check the admin toggle. Render only when explicitly enabled.
        var self = this;
        google.script.run
          .withSuccessHandler(function (val) {
            self.enabled = !!val;
          })
          .withFailureHandler(function () {
            self.enabled = false;
          })
          .getBetaFeedbackEnabled();
      },

      ratingLabel(n) {
        return ["", "แย่มาก", "ไม่ดี", "พอใช้", "ดี", "ดีมาก"][n] || "";
      },

      close() {
        if (this.submitting) return;
        this.open = false;
        this.error = "";
      },

      submit() {
        if (this.submitting || this.rating < 1) return;
        this.submitting = true;
        this.error = "";
        var self = this;
        var payload = {
          rating: this.rating,
          comment: this.comment || "",
          page: this.pageLabel,
          userAgent: navigator.userAgent || "",
        };
        google.script.run
          .withSuccessHandler(function (res) {
            self.submitting = false;
            if (res && res.success) {
              self.open = false;
              self.rating = 0;
              self.comment = "";
              self.thanks = true;
              setTimeout(function () {
                self.thanks = false;
              }, 2800);
            } else if (res && res.disabled) {
              self.enabled = false;
              self.open = false;
            } else {
              self.error = "ส่งไม่สำเร็จ กรุณาลองใหม่";
            }
          })
          .withFailureHandler(function (err) {
            self.submitting = false;
            self.error = (err && err.message) || "ส่งไม่สำเร็จ กรุณาลองใหม่";
          })
          .submitBetaFeedback(payload);
      },
    };
  }
</script>
