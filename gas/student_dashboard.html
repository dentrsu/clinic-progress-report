                        <div class="flex justify-between items-start mb-2">
                          <div>
                            <div class="font-bold text-navy text-sm" x-text="p.name"></div>
                            <div class="text-[0.65rem] font-mono text-gray-500 mt-0.5">HN: <span x-text="p.hn"></span></div>
                          </div>
                          <span class="px-2 py-0.5 rounded text-[0.6rem] font-bold uppercase tracking-wide border shadow-sm"
                                :class="getComplexityClass(p.complexity)" x-text="p.status"></span>
                        </div>
                        <div class="flex items-center gap-1.5 text-xs text-gray-500 mb-3">
                          <span class="font-medium text-gray-400">Type:</span> <span x-text="p.type_of_case || '-'"></span>
                        </div>
                        <a :href="'<?= appUrl ?>?page=treatment_plan&hn=' + encodeURIComponent(p.hn)" target="_blank"
                           class="w-full flex justify-center items-center gap-1.5 py-1.5 bg-gray-50 text-navy font-semibold rounded-lg hover:bg-gray-100 transition border border-gray-200 text-xs text-center">
                          View Treatment Plan
                        </a>
                      </div>
                    </template>
                  </div>
                </div>

              </div>
            </div>

          </div>

          <!-- Modal Footer -->
          <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 shrink-0">
            <button @click="modalOpen = false"
                    class="w-full py-2 bg-white border border-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-100 transition shadow-sm text-sm">Close</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <script>
    function studentDashboardApp() {
      return {
        state: 'loading',
        errorMessage: '',
        students: [],

        searchQuery: '',
        filterYear: 'all',
        filterFloor: 'all',
        filterTeamLeader: 'all',

        modalOpen: false,
        selectedStudent: null,
        studentPatients: [],
        loadingPatients: false,
        showStudentDetail: false,
        showOracleForecast: false,
        clinicalEndDate: '',

        init() {
          google.script.run
            .withSuccessHandler(res => {
              this.students = res || [];
              this.state = 'loaded';
            })
            .withFailureHandler(err => {
              this.errorMessage = err.message || 'An unexpected error occurred.';
              this.state = 'error';
            })
            .adminGetAllStudents();
        },

        availableYears() {
          var set = new Set();
          this.students.forEach(s => { if (typeof s.calculated_year === 'number') set.add(s.calculated_year); });
          return Array.from(set).sort((a, b) => b - a);
        },

        availableFloors() {
          var map = {};
          this.students.forEach(s => { if (s.floor_id) map[s.floor_id] = s.floor_label; });
          return Object.keys(map).map(id => ({ floor_id: id, label: map[id] }))
            .sort((a, b) => String(a.label).localeCompare(String(b.label)));
        },

        availableTeamLeaders() {
          var set = new Set();
          this.students.forEach(s => {
            if (s.team_leader_1_name && s.team_leader_1_name !== '-') set.add(s.team_leader_1_name);
            if (s.team_leader_2_name && s.team_leader_2_name !== '-') set.add(s.team_leader_2_name);
          });
          return Array.from(set).sort((a, b) => String(a).localeCompare(String(b)));
        },

        filteredStudents() {
          var q = (this.searchQuery || '').trim().toLowerCase();
          return this.students.filter(s => {
            if (this.filterYear !== 'all' && String(s.calculated_year) !== String(this.filterYear)) return false;
            if (this.filterFloor !== 'all' && String(s.floor_id) !== String(this.filterFloor)) return false;
            if (this.filterTeamLeader !== 'all' &&
                s.team_leader_1_name !== this.filterTeamLeader &&
                s.team_leader_2_name !== this.filterTeamLeader) return false;
            if (q && !(String(s.name).toLowerCase().indexOf(q) >= 0 ||
                       String(s.academic_id).toLowerCase().indexOf(q) >= 0)) return false;
            return true;
          });
        },

        resetFilters() {
          this.searchQuery = '';
          this.filterYear = 'all';
          this.filterFloor = 'all';
          this.filterTeamLeader = 'all';
        },

        getInitials(name) {
          if (!name) return '?';
          var parts = name.trim().split(/\s+/);
          if (parts.length === 0) return '?';
          var firstPart = '', lastPart = '';
          var firstWord = parts[0];
          if (firstWord.indexOf('.') !== -1) {
            var dotParts = firstWord.split('.');
            var afterLastDot = dotParts[dotParts.length - 1];
            firstPart = afterLastDot.length > 0 ? afterLastDot : (parts.length > 1 ? parts[1] : '');
          } else {
            var knownTitles = ['นาย', 'นาง', 'นางสาว', 'นพ', 'ทพ', 'ดร', 'ทญ'];
            firstPart = (knownTitles.indexOf(firstWord) !== -1 || parts.length >= 3)
              ? (parts.length > 1 ? parts[1] : '')
              : firstWord;
          }
          lastPart = parts.length > 1 ? parts[parts.length - 1] : '';
          function getConsonant(str) {
            if (!str) return '';
            var m = str.match(/[ก-ฮa-zA-Z]/);
            return m ? m[0] : str.charAt(0);
          }
          return (getConsonant(firstPart) + (lastPart ? getConsonant(lastPart) : '')).toUpperCase();
        },

        getComplexityClass(complexity) {
          if (!complexity || String(complexity).trim().toLowerCase() === 'none') {
            return 'bg-gray-100 text-gray-400 border-gray-200';
          }
          const cStr = String(complexity).trim();
          if (cStr === '1') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
          if (cStr === '2') return 'bg-blue-100 text-blue-700 border-blue-200';
          if (cStr === '>=2' || cStr === '>2' || parseInt(cStr) >= 2) {
            return 'bg-amber-100 text-amber-700 border-amber-200';
          }
          return 'bg-gray-100 text-gray-400 border-gray-200';
        },

        getComplexityCardClass(complexity) {
          const defaultBg = 'bg-white';
          if (!complexity || String(complexity).trim().toLowerCase() === 'none') return defaultBg;
          const cStr = String(complexity).trim();
          if (cStr === '1') return 'bg-emerald-50';
          if (cStr === '2') return 'bg-blue-50';
          if (cStr === '>=2' || cStr === '>2' || parseInt(cStr) >= 2) return 'bg-amber-50';
          return defaultBg;
        },

        ownPatients() {
          if (!this.selectedStudent) return [];
          return this.studentPatients.filter(p => p.student_id_1 === this.selectedStudent.student_id);
        },

        referralPatients() {
          if (!this.selectedStudent) return [];
          return this.studentPatients.filter(p => p.student_id_1 !== this.selectedStudent.student_id);
        },

        openModal(student) {
          this.selectedStudent = student;
          this.studentPatients = [];
          this.loadingPatients = true;
          this.modalOpen = true;
          this.showOracleForecast = false;

          var baseYear = student.first_clinic_year ? parseInt(student.first_clinic_year) + 2 : new Date().getFullYear() + 1;
          var mayFirst = new Date(baseYear, 4, 1);
          var firstFridayOffset = (5 - mayFirst.getDay() + 7) % 7;
          var secondFridayDate = 1 + firstFridayOffset + 7;
          var defaultEndDate = new Date(baseYear, 4, secondFridayDate);
          var yyyy = defaultEndDate.getFullYear();
          var mm = String(defaultEndDate.getMonth() + 1).padStart(2, '0');
          var dd = String(defaultEndDate.getDate()).padStart(2, '0');
          this.clinicalEndDate = yyyy + '-' + mm + '-' + dd;

          google.script.run
            .withSuccessHandler(res => {
              this.studentPatients = res || [];
              this.loadingPatients = false;
            })
            .withFailureHandler(err => {
              console.error(err);
              this.loadingPatients = false;
            })
            .getStudentPatients(student.student_id);
        },

        formatDate(d) {
          if (!d) return '-';
          return new Date(d).toLocaleDateString('th-TH');
        },

        formatTime(d) {
          if (!d) return '';
          return new Date(d).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        },

        getRemainingDate(endDateString) {
          if (!endDateString) return '-';
          var end = new Date(endDateString);
          var now = new Date();
          end.setHours(0, 0, 0, 0);
          now.setHours(0, 0, 0, 0);
          var diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
          if (diffDays < 0) return Math.abs(diffDays) + ' days overdue';
          return diffDays + ' days left';
        },

        getForecastDiff(forecastDateString) {
          if (!forecastDateString) return '-';
          var forecast = new Date(forecastDateString);
          var now = new Date();
          forecast.setHours(0, 0, 0, 0);
          now.setHours(0, 0, 0, 0);
          var diffDays = Math.ceil((forecast - now) / (1000 * 60 * 60 * 24));
          var diffMonths = Math.round(diffDays / 30.44);
          if (diffDays < 0) return Math.abs(diffDays) + ' days ago';
          if (diffMonths >= 1) return '~' + diffMonths + ' months';
          return diffDays + ' days';
        },

        getForecastDiffClass(forecastDateString) {
          if (!forecastDateString) return 'text-gray-500';
          var forecast = new Date(forecastDateString);
          if (!this.clinicalEndDate) return 'text-navy';
          var end = new Date(this.clinicalEndDate);
          if (forecast > end) return 'text-red-500';
          return 'text-emerald-600';
        }
      }
    }
  </script>
</body>

</html>
